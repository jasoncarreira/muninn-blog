<!-- Mermaid support for diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: 'dark',
    themeVariables: {
      primaryColor: '#ffa86a',
      primaryTextColor: '#fff',
      primaryBorderColor: '#ffa86a',
      lineColor: '#ffa86a',
      secondaryColor: '#1d1e28',
      tertiaryColor: '#1d1e28'
    }
  });
</script>
